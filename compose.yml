services:
  llm:
    build: .
    command: python llm.py

    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_URL: ${MISTRAL_URL:-https://api.mistral.ai/v1/chat/completions}
      MISTRAL_TIMEOUT: ${MISTRAL_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  guardrails:
    build: .
    command: python guardrails.py

    environment:
      FIREBASE_DB: ${FIREBASE_DB}
      FIREBASE_TIMEOUT: ${FIREBASE_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  auberge:
    build: .
    command: python auberge.py

    environment:
      GUARDRAILS_URL: http://guardrails:3001
      LLM_URL: http://llm:3000/llm
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "3002:3002"

    depends_on:
      llm:
        condition: service_healthy

      guardrails:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
