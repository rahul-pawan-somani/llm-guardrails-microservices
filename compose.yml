services:
  llm:
    build: .
    command: python llm.py

    env_file:
      - .env

    ports:
      - "3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  guardrails:
    build: .
    command: python guardrails.py

    env_file:
      - .env

    ports:
      - "3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  auberge:
    build: .
    command: python auberge.py

    env_file:
      - .env

    environment:
      GUARDRAILS_URL: http://guardrails:3001
      LLM_URL: http://llm:3000/llm

    ports:
      - "3002:3002"

    depends_on:
      llm:
        condition: service_healthy

      guardrails:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
